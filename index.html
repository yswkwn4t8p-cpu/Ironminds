<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Ironminds</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--good:#059669;--shadow:0 8px 30px #0f172a12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding:16px 16px 90px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{margin:0}.sub,.muted{color:var(--muted);font-size:12px}.actions{display:flex;gap:7px}.btn,.icon{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.good{background:var(--good);color:#fff;border-color:var(--good)}.tabs{display:flex;gap:5px;background:#e9edf2;padding:4px;border-radius:14px;margin-bottom:15px}.tab{flex:1;border:0;background:transparent;padding:10px;border-radius:10px}.tab.active{background:#fff;font-weight:800}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:var(--shadow)}.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}h2,h3{margin:0 0 10px}.hero{background:#111827;color:#fff;border:0}.hero-row{display:flex;justify-content:space-between;align-items:end;gap:15px}.hero .muted{color:#cbd5e1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:15px}.stat{padding:11px;border:1px solid #ffffff1c;border-radius:12px}.stat b{display:block;font-size:20px}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px;border:1px solid var(--line);border-radius:12px}.row-sub{font-size:12px;color:var(--muted)}.pill{padding:4px 8px;border-radius:99px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:800}.form{display:grid;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.exercise-picker{max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:11px}.pick{display:flex;gap:9px;padding:10px;border-bottom:1px solid var(--line)}.workout-ex{border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:9px}.sethead,.setrow{display:grid;grid-template-columns:35px 1fr 1fr 1fr 35px;gap:6px;align-items:center}.sethead{font-size:10px;color:var(--muted);margin-top:9px}.setrow{margin-top:6px}.setrow input{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px}.notice{margin-top:8px;padding:9px;border-radius:10px;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;font-size:12px}.timer{text-align:center;font-size:30px;font-weight:900;padding:10px}.canvas{height:230px}.canvas canvas{width:100%;height:100%}.bottom{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 15px;border-radius:99px;opacity:0}.toast.show{opacity:1}
@media(max-width:700px){.app{padding:12px 10px 85px}.tabs{display:none}.s4,.s6,.s8{grid-column:span 12}.hero-row{display:block}.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.bottom{position:fixed;display:flex;bottom:0;left:0;right:0;background:#fffffff7;border-top:1px solid var(--line);z-index:5;justify-content:space-around;padding:5px}.bottom button{border:0;background:transparent;font-size:10px}.bottom b{display:block;font-size:18px}.actions span{display:none}}
</style></head><body><div class="app">
<header><div class="brand"><div class="logo">IM</div><div><h1>Ironminds</h1><div class="sub">Train smart. Track everything.</div></div></div><div class="actions"><button class="btn" id="exp">⇩ <span>Backup</span></button><button class="btn" id="imp">⇧ <span>Import</span></button><input id="file" type="file" accept=".json" hidden></div></header>
<nav class="tabs"><button class="tab active" data-p="home">Übersicht</button><button class="tab" data-p="workout">Training</button><button class="tab" data-p="history">Historie</button><button class="tab" data-p="plans">Pläne</button><button class="tab" data-p="exercises">Übungen</button></nav><main id="content"></main></div>
<nav class="bottom"><button data-p="home">⌂<br>Home</button><button data-p="workout">▶<br>Training</button><button data-p="history">↗<br>Historie</button><button data-p="plans">☷<br>Pläne</button><button data-p="exercises">＋<br>Übungen</button></nav><div id="toast" class="toast"></div>
<script>
const K='ironminds-v2',seed={exercises:[{id:'e1',name:'Bankdrücken',muscle:'Brust',type:'Kraft'},{id:'e2',name:'Kniebeugen',muscle:'Beine',type:'Kraft'},{id:'e3',name:'Kreuzheben',muscle:'Rücken',type:'Kraft'},{id:'e4',name:'Schulterdrücken',muscle:'Schultern',type:'Kraft'},{id:'e5',name:'Klimmzüge',muscle:'Rücken',type:'Körpergewicht'}],plans:[],workouts:[]};let db=JSON.parse(localStorage.getItem(K)||'null')||seed,page='home',timer;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),save=()=>localStorage.setItem(K,JSON.stringify(db)),fmt=d=>new Date(d).toLocaleDateString('de-DE'),toast=x=>{let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)};
function go(p){page=p;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));render()}
function volume(){return Math.round(db.workouts.reduce((a,w)=>a+w.exercises.reduce((b,e)=>b+e.sets.reduce((c,s)=>c+(+s.weight||0)*(+s.reps||0),0),0),0))}
function home(){return `<div class="grid"><section class="card hero s12"><div class="hero-row"><div><div class="muted">IRONMINDS</div><h2>Bereit fürs nächste Training?</h2><div class="muted">Deine letzten Gewichte werden automatisch vorausgefüllt.</div></div><button class="btn primary" onclick="go('workout')">＋ Training starten</button></div><div class="stats"><div class="stat"><b>${db.workouts.length}</b><span>Trainings</span></div><div class="stat"><b>${db.plans.length}</b><span>Pläne</span></div><div class="stat"><b>${volume()} kg</b><span>Volumen</span></div><div class="stat"><b>${db.exercises.length}</b><span>Übungen</span></div></div></section><section class="card s6"><h3>Letzte Trainings</h3>${db.workouts.length?`<div class="list">${db.workouts.slice(0,6).map(w=>`<div class="row"><div><b>${esc(w.name)}</b><div class="row-sub">${fmt(w.date)} · ${w.exercises.length} Übungen</div></div><span class="pill">${w.exercises.reduce((a,e)=>a+e.sets.length,0)} Sätze</span></div>`).join('')}</div>`:'<div class="muted">Noch keine Trainings.</div>'}</section><section class="card s6"><h3>Schnellzugriff</h3><div class="list"><button class="btn" onclick="go('plans')">☷ Pläne verwalten</button><button class="btn" onclick="go('history')">↗ Fortschritt ansehen</button><button class="btn" onclick="go('exercises')">＋ Übung anlegen</button></div></section></div>`}
function workout(){return `<div class="grid"><section class="card s12"><h2>Training</h2><div class="two"><div class="field"><label>Trainingsplan</label><select id="plan"><option value="">Freies Training</option>${db.plans.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Titel</label><input id="wname" placeholder="z. B. Push A"></div></div><div class="two" style="margin-top:9px"><div class="field"><label>Datum</label><input id="wdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Pause</label><select id="pause"><option value="60">60 Sek.</option><option value="90">90 Sek.</option><option value="120">120 Sek.</option><option value="180">180 Sek.</option></select></div></div><div id="editor"></div></section></div>`}
function lastSets(pid,eid){let w=db.workouts.filter(w=>(pid?w.planId===pid:true)&&w.exercises.some(e=>e.exerciseId===eid)).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];return w?.exercises.find(e=>e.exerciseId===eid)?.sets||[]}
function row(n,s={}){return `<div class="setrow"><span>${n}</span><input type="number" step=".5" value="${s.weight||''}" placeholder="kg"><input type="number" value="${s.reps||''}" placeholder="Wdh."><input type="number" step=".5" value="${s.rpe||''}" placeholder="RPE"><input type="checkbox" ${s.done?'checked':''}></div>`}
function editor(ids,pid){return `<div class="card" style="margin-top:12px"><h3>Sätze</h3>${ids.map(id=>{let e=db.exercises.find(x=>x.id===id),last=lastSets(pid,id),ss=last.length?last:[{}];return `<div class="workout-ex" data-e="${id}"><b>${esc(e.name)}</b>${last.length?`<div class="notice">Letztes Training: ${last.map(s=>`${s.weight||'-'} kg × ${s.reps||'-'}`).join(' · ')} · vorausgefüllt</div>`:''}<div class="sethead"><span>#</span><span>Gewicht</span><span>Wdh.</span><span>RPE</span><span>✓</span></div><div class="sets">${ss.map((s,i)=>row(i+1,s)).join('')}</div><button class="btn" onclick="addSet(this)">＋ Satz</button></div>`}).join('')}<div class="field" style="margin-top:10px"><label>Notiz</label><textarea id="note" placeholder="Wie lief das Training?"></textarea></div><button class="btn" onclick="startTimer()">⏱ Pause starten</button> <button class="btn good" id="finish">✓ Training abschließen</button><div id="timer"></div></div>`}
function addSet(b){let q=b.previousElementSibling;q.insertAdjacentHTML('beforeend',row(q.children.length+1))}
function loadPlan(){let p=document.getElementById('plan').value,x=db.plans.find(p=>p.id===x?.id);let plan=db.plans.find(p=>p.id===document.getElementById('plan').value);if(plan){document.getElementById('wname').value=plan.name;document.getElementById('editor').innerHTML=editor(plan.exerciseIds,plan.id)}else document.getElementById('editor').innerHTML=editor(db.exercises.map(e=>e.id),'')}
function finish(){let pid=document.getElementById('plan').value,ex=[...document.querySelectorAll('.workout-ex')].map(b=>({exerciseId:b.dataset.e,sets:[...b.querySelectorAll('.setrow')].map(r=>{let i=r.querySelectorAll('input');return{weight:i[0].value,reps:i[1].value,rpe:i[2].value,done:i[3].checked}}).filter(s=>s.weight||s.reps)})).filter(x=>x.sets.length);if(!ex.length)return toast('Bitte mindestens einen Satz eintragen');db.workouts.unshift({id:uid(),planId:pid,name:document.getElementById('wname').value||'Training',date:document.getElementById('wdate').value,notes:document.getElementById('note').value,exercises:ex});save();go('home');toast('Training gespeichert ✓')}
function plans(){return `<div class="grid"><section class="card s6"><h2>Plan erstellen</h2><div class="form"><div class="field"><label>Planname</label><input id="pname" placeholder="z. B. Push A"></div><div class="field"><label>Übungen</label><div class="exercise-picker">${db.exercises.map(e=>`<label class="pick"><input type="checkbox" class="pp" value="${e.id}"><span><b>${esc(e.name)}</b><br><span class="muted">${esc(e.muscle)}</span></span></label>`).join('')}</div></div><button class="btn primary" id="saveplan">Plan speichern</button></div></section><section class="card s6"><h2>Meine Pläne</h2>${db.plans.length?`<div class="list">${db.plans.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><div class="row-sub">${p.exerciseIds.length} Übungen · ${db.workouts.filter(w=>w.planId===p.id).length} Trainings</div></div><div><button class="icon" onclick="startPlan('${p.id}')">▶</button><button class="icon" onclick="delPlan('${p.id}')">×</button></div></div>`).join('')}</div>`:'<div class="muted">Noch keine Pläne.</div>'}</section></div>`}
function startPlan(id){go('workout');setTimeout(()=>{document.getElementById('plan').value=id;loadPlan()},20)}function delPlan(id){db.plans=db.plans.filter(p=>p.id!==id);save();render()}
function exercises(){return `<div class="grid"><section class="card s4"><h2>Übung hinzufügen</h2><div class="form"><div class="field"><label>Name</label><input id="ename"></div><div class="field"><label>Muskelgruppe</label><input id="muscle"></div><button class="btn primary" id="saveex">Übung speichern</button></div></section><section class="card s8"><h2>Meine Übungen</h2><div class="list">${db.exercises.map(e=>`<div class="row"><div><b>${esc(e.name)}</b><div class="row-sub">${esc(e.muscle)}</div></div></div>`).join('')}</div></section></div>`}
function history(){let id=document.getElementById('hex')?.value||db.exercises[0]?.id,pts=[];db.workouts.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(w=>w.exercises.filter(e=>e.exerciseId===id).forEach(e=>{let s=e.sets.filter(x=>+x.weight&&+x.reps);if(s.length)pts.push({date:w.date,max:Math.max(...s.map(x=>+x.weight)),volume:s.reduce((a,x)=>a+(+x.weight)*(+x.reps),0)})}));return `<div class="grid"><section class="card s12"><h2>Historie & Fortschritt</h2><div class="field"><label>Übung</label><select id="hex">${db.exercises.map(e=>`<option value="${e.id}" ${e.id===id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div></section><section class="card s6"><h3>Maximalgewicht</h3><div class="canvas"><canvas id="c1"></canvas></div></section><section class="card s6"><h3>Volumen</h3><div class="canvas"><canvas id="c2"></canvas></div></section><section class="card s12"><h3>Einträge</h3>${pts.length?`<div class="list">${pts.slice().reverse().map(p=>`<div class="row"><b>${fmt(p.date)}</b><span>${p.max} kg · ${Math.round(p.volume)} kg Volumen</span></div>`).join('')}</div>`:'<div class="muted">Noch keine Daten.</div>'}</section></div>`}
function chart(id,pts,key){let c=document.getElementById(id);if(!c||!pts.length)return;let r=c.getBoundingClientRect(),d=devicePixelRatio||1,w=r.width,h=r.height;c.width=w*d;c.height=h*d;let x=c.getContext('2d');x.scale(d,d);let p=28,v=pts.map(a=>a[key]),mn=Math.min(...v),mx=Math.max(...v),ra=mx-mn||1;x.strokeStyle='#e5e7eb';for(let i=0;i<4;i++){let y=p+(h-2*p)*i/3;x.beginPath();x.moveTo(p,y);x.lineTo(w-p,y);x.stroke()}x.strokeStyle='#2563eb';x.lineWidth=3;x.beginPath();pts.forEach((a,i)=>{let xx=p+(w-2*p)*i/Math.max(1,pts.length-1),yy=h-p-(h-2*p)*(a[key]-mn)/ra;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();x.fillStyle='#111827';x.fillText(mx+' kg',p,15)}
function timerStart(){clearInterval(timer);let n=+document.getElementById('pause').value,t=document.getElementById('timer');t.innerHTML='<div class="timer">'+n+' s</div>';timer=setInterval(()=>{n--;t.innerHTML='<div class="timer">'+n+' s</div>';if(n<=0){clearInterval(timer);toast('Pause beendet!')}},1000)}
function bind(){document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));let p=document.getElementById('plan');if(p){p.onchange=loadPlan;if(!document.getElementById('editor').innerHTML)loadPlan()}let f=document.getElementById('finish');if(f)f.onclick=finish;let sp=document.getElementById('saveplan');if(sp)sp.onclick=()=>{let n=document.getElementById('pname').value.trim(),ids=[...document.querySelectorAll('.pp:checked')].map(x=>x.value);if(!n||!ids.length)return toast('Name und Übungen auswählen');db.plans.push({id:uid(),name:n,exerciseIds:ids});save();render();toast('Plan gespeichert ✓')};let se=document.getElementById('saveex');if(se)se.onclick=()=>{let n=document.getElementById('ename').value.trim();if(!n)return toast('Name fehlt');db.exercises.push({id:uid(),name:n,muscle:document.getElementById('muscle').value||'Sonstige',type:'Kraft'});save();render()};let h=document.getElementById('hex');if(h)h.onchange=render;if(page==='history')setTimeout(()=>{let id=h?.value,pts=[];db.workouts.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(w=>w.exercises.filter(e=>e.exerciseId===id).forEach(e=>{let s=e.sets.filter(x=>+x.weight&&+x.reps);if(s.length)pts.push({date:w.date,max:Math.max(...s.map(x=>+x.weight)),volume:s.reduce((a,x)=>a+(+x.weight)*(+x.reps),0)})}));chart('c1',pts,'max');chart('c2',pts,'volume')},30)}
function render(){document.getElementById('content').innerHTML=page==='home'?home():page==='workout'?workout():page==='plans'?plans():page==='exercises'?exercises():history();bind()}
document.getElementById('exp').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='ironminds-backup.json';a.click()};document.getElementById('imp').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>{let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();toast('Backup importiert ✓')}catch{toast('Ungültiges Backup')}};r.readAsText(e.target.files[0])};window.startTimer=timerStart;render();
</script></body></html>
